<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}

.screen.out{opacity:0;pointer-events:none}
.om{color:var(--gold);letter-spacing:.15em;font-size:14px}

.langs button:hover{border-color:var(--acc)}

.env.open .flap{transform:rotateX(180deg);z-index:0}
.seal{position:absolute;left:50%;top:52%;translate:-50% -50%;z-index:4;width:64px;height:64px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#c4475a,var(--acc));color:#fff;font:700 22px 'Cormorant Garamond',serif;cursor:pointer;box-shadow:0 4px 12px #0004;animation:pulse 2s infinite;transition:opacity .4s}

.env .front{position:absolute;inset:0;z-index:2;border-radius:6px;background:linear-gradient(color-mix(in srgb,var(--env) 85%,#fff),var(--env));clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:9%;text-align:center;pointer-events:none}
.card2{position:absolute;left:8%;right:8%;top:12%;bottom:6%;z-index:1;background:var(--card);border:1px solid var(--gold);outline:1px solid var(--line);outline-offset:-7px;border-radius:4px;box-shadow:0 6px 20px #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:14px;transition:transform 1.1s cubic-bezier(.3,.8,.3,1) .6s}

.env.open .card2{transform:translateY(-55%)}
.env.show .card2{z-index:6;transform:translateY(-14%) scale(1.15);transition:transform 1.1s cubic-bezier(.3,.8,.3,1)}
.screen.opening{overflow:hidden}.screen.opening>.c,.screen.opening .hint,.screen.opening .skip{opacity:0;transition:opacity .5s}
#site{animation:fin 1.1s both}@keyframes fin{from{opacity:0;transform:translateY(16px)}}
.env .t1{font:italic 500 18px 'Cormorant Garamond',serif;color:var(--mut)}.env .t2{font:700 30px 'Cormorant Garamond',serif;line-height:1.1}.env .t3{font-size:13px;color:var(--mut)}
.skip{margin-top:26px;background:none;border:0;color:var(--mut);font:inherit;text-decoration:underline;cursor:pointer}
.hint{color:var(--mut);font-size:13px;margin-top:14px;letter-spacing:.08em}
main{max-width:760px;margin:0 auto;padding:0 20px 80px}
.hero{text-align:center;padding:56px 0 24px}
.hero h1{font-size:clamp(52px,14vw,92px);line-height:1;color:var(--acc);margin:14px 0}

.names{color:var(--mut);letter-spacing:.12em;font-size:14px}
.tag{font:italic 500 26px 'Cormorant Garamond',serif;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px;margin:22px 0;text-align:center}
.lbl{letter-spacing:.2em;font-size:12px;text-transform:uppercase;color:var(--gold)}
.big{font:700 clamp(28px,7vw,40px)/1.15 'Cormorant Garamond',serif;color:var(--acc);margin:8px 0}
.btn{background:var(--acc);color:#fff;border:0;border-radius:99px;padding:10px 26px;font:500 15px Jost,sans-serif;cursor:pointer;margin-top:10px}

.photo.on{filter:none}.photo img{width:100%;height:100%;object-fit:cover}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.cd div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 4px}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
nav button{flex:none;background:none;border:1px solid transparent;border-radius:99px;padding:8px 16px;font:inherit;color:var(--mut);cursor:pointer;white-space:nowrap}

section{padding:30px 0}section h2{font-size:clamp(32px,8vw,44px);color:var(--acc);margin:6px 0 18px}

form{display:grid;gap:12px}

#editBtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:11px 18px;font:500 14px Jost,sans-serif;cursor:pointer;box-shadow:0 6px 18px #0004}
#lang{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:11px 16px;font:500 14px Jost,sans-serif;cursor:pointer;width:auto}

#panel.on{transform:none}#panel label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 4px}

var REV=false;
function initScratch(){
 var box=$('sc'),cv=$('scv');if(!box||!cv)return;
 var w=box.clientWidth,h=box.clientHeight,dpr=window.devicePixelRatio||1;
 cv.width=w*dpr;cv.height=h*dpr;var x=cv.getContext('2d');x.scale(dpr,dpr);
 var g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#d9b068');g.addColorStop(.5,'#f3dca0');g.addColorStop(1,'#b98a3e');
 x.fillStyle=g;x.fillRect(0,0,w,h);
 for(var i=0;i<300;i++){x.fillStyle='rgba(255,255,255,'+Math.random()*.3+')';x.fillRect(Math.random()*w,Math.random()*h,2,2)}
 x.fillStyle='#6b4c14';x.font='600 20px Jost,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('✨ '+T[L].rev+' ✨',w/2,h/2);
 var down=false,done=false,n=0;
 function pos(e){var r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
 function check(){var d=x.getImageData(0,0,cv.width,cv.height).data,c=0,t=0;for(var i=3;i<d.length;i+=64){t++;if(d[i]<128)c++}if(c/t>.45)finish()}
 function finish(){done=true;REV=true;cv.style.opacity=0;setTimeout(function(){cv.style.display='none'},700);var p=$('ph');if(p)p.classList.add('on')}
 function scratch(e){if(!down||done)return;var p=pos(e);x.globalCompositeOperation='destination-out';x.beginPath();x.arc(p[0],p[1],22,0,7);x.fill();if(++n%6==0)check()}
 cv.onpointerdown=function(e){down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}scratch(e)};
 cv.onpointermove=scratch;cv.onpointerup=cv.onpointercancel=function(){down=false};
}
function tick(){var t=new Date(D.start+'T00:00:00')-new Date(),v=[0,0,0,0];if(t>0){v=[Math.floor(t/864e5),Math.floor(t/36e5)%24,Math.floor(t/6e4)%60,Math.floor(t/1e3)%60]}
 for(var i=0;i<4;i++){var e=$('d'+i);if(e)e.textContent=String(v[i]).padStart(i?2:1,'0')}}
setInterval(tick,1000);
