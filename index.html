var REV=false;
function initScratch(){
 var box=$('sc'),cv=$('scv');if(!box||!cv)return;
 var w=box.clientWidth,h=box.clientHeight,dpr=window.devicePixelRatio||1;
 if(!w||!h)return;cv.width=w*dpr;cv.height=h*dpr;var x=cv.getContext('2d');x.scale(dpr,dpr);
 var g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#d9b068');g.addColorStop(.5,'#f3dca0');g.addColorStop(1,'#b98a3e');
 x.fillStyle=g;x.fillRect(0,0,w,h);
 for(var i=0;i<300;i++){x.fillStyle='rgba(255,255,255,'+Math.random()*.3+')';x.fillRect(Math.random()*w,Math.random()*h,2,2)}
 x.fillStyle='#6b4c14';x.font='600 20px Jost,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('✨ '+T[L].rev+' ✨',w/2,h/2);
 var down=false,done=false,n=0;
 function pos(e){var r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
 function check(){var d=x.getImageData(0,0,cv.width,cv.height).data,c=0,t=0;for(var i=3;i<d.length;i+=64){t++;if(d[i]<128)c++}if(c/t>.45)finish()}
 function finish(){done=true;REV=true;cv.style.opacity=0;setTimeout(function(){cv.style.display='none'},700);var p=$('ph');if(p)p.classList.add('on')}
 function scratch(e){if(!down||done)return;var p=pos(e);x.globalCompositeOperation='destination-out';x.beginPath();x.arc(p[0],p[1],22,0,7);x.fill();if(++n%6==0)check()}
 cv.onpointerdown=function(e){down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}scratch(e)};
 cv.onpointermove=scratch;cv.onpointerup=cv.onpointercancel=function(){down=false};
}
function tick(){var t=new Date(D.start+'T00:00:00')-new Date(),v=[0,0,0,0];if(t>0){v=[Math.floor(t/864e5),Math.floor(t/36e5)%24,Math.floor(t/6e4)%60,Math.floor(t/1e3)%60]}
 for(var i=0;i<4;i++){var e=$('d'+i);if(e)e.textContent=String(v[i]).padStart(i?2:1,'0')}}
setInterval(tick,1000);

function burst(){var e=$('env'),em=['✨','💛','🌸','💖','🎉','🌼','💫','✨'];for(var i=0;i<16;i++){var s=document.createElement('span');s.className='cf';s.textContent=em[i%em.length];var a=Math.random()*Math.PI*2,r=90+Math.random()*110;s.style.setProperty('--x',Math.cos(a)*r+'px');s.style.setProperty('--y',(Math.sin(a)*r-60)+'px');s.style.setProperty('--r',(Math.random()*360-180)+'deg');s.style.animationDelay=(Math.random()*.25)+'s';e.appendChild(s);setTimeout(function(x){return function(){x.remove()}}(s),2100)}}
function openEnv(){var e=$('env');$('envScreen').classList.add('opening');e.classList.add('open');setTimeout(function(){e.classList.add('show');burst()},1800);setTimeout(enterSite,4800)}
